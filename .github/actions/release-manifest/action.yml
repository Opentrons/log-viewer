name: "Update release manifest"
description: "Activate or revoke the latest production release and refresh the stable download links."
inputs:
  command:
    description: "activate or revoke"
    required: true
    type: choice
    options:
      - activate
      - revoke

runs:
  using: "composite"
  steps:
    - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
    - name: "Configure AWS credentials (GitHub OIDC)"
      uses: "aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a" # v4.3.1
      with:
        role-to-assume: ${{ vars.OT_LOGVIEWER_DEPLOY_ROLE }}
        aws-region: us-east-1
    - uses: "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7" # v10.2.0
      with:
        version: "0.12.23"
    - name: "Update releases.json and stable links"
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.command }}" in
          activate|revoke) ;;
          *)
            echo "command must be activate or revoke" >&2
            exit 1
            ;;
        esac
        uv run scripts/releases.py "${{ inputs.command }}" \
          --bucket "${{ vars.DEPLOY_BUCKET }}" \
          --prefix "${{ vars.DEPLOY_PREFIX_BASE }}" \
          --distribution-id "${{ vars.OT_LOGVIEWER_BUILDS_CLOUDFRONT_DISTRIBUTION_ID }}"
