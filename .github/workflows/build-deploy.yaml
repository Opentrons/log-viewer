name: "Build and deploy"

on:
  push:
    branches:
      - "main"
      - "release"
      - "chore_release-*"
      - "build-*"
    tags:
      - "v*"
  workflow_dispatch:

env:
  CI: true
  _DEPLOY_BUCKET_RELEASE: builds.opentrons.com
  _DEPLOY_BUCKET_INTERNAL: ot3-development.builds.opentrons.com
  _DEPLOY_FOLDER: logviewer

jobs:
  build:
    name: "app build"
    environment: "prod"
    strategy:
      matrix:
        os: ["windows-2022", "ubuntu-22.04", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
      - uses: "pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2" # v2.0.2
        with:
          cache: true
      - uses: "extractions/setup-crate@7577c1bdf2d95e6d65d532788f35ed79d4b1dda2" # v2.0.1
        with:
          repo: casey/just
          version: 1.58.0
      - name: "Setup"
        run: just setup
      - name: "Build"
        run: just build
        env:
          AZURE_TENANT_ID: ${{secrets.AZURE_TENANT_ID}}
          AZURE_CLIENT_ID: ${{secrets.AZURE_CLIENT_ID}}
          AZURE_CLIENT_SECRET: ${{secrets.AZURE_CLIENT_SECRET}}
          CSC_LINK: ${{ secrets.OT_APP_CSC_MACOS }}
          CSC_KEY_PASSWORD: ${{ secrets.OT_APP_CSC_KEY_MACOS }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.OT_APP_APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.OT_APP_APPLE_TEAM_ID }}
      - name: "Upload artifact"
        id: "artifact-upload"
        uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
        with:
          name: "logverifier-${{matrix.os}}-${{github.run_id}}"
          path: "app-shell/dist/*"
      - name: "Artifact result"
        run: echo "Artifact is ${{ steps.artifact-upload.outputs.artifact-url }}"

  deploy:
    name: "Deploy artifacts to S3"
    needs: ["build"]
    if: vars.OT_LOGVIEWER_DEPLOY_ROLE != ''
    runs-on: "ubuntu-22.04"
    environment: "prod"
    permissions:
      id-token: write
      contents: read
    steps:
      - name: "Choose S3 destination"
        id: "target"
        shell: bash
        run: |
          ref="${{ github.ref }}"
          if [[ "$ref" == refs/tags/v* ]] || [[ "$ref" == refs/heads/release ]] || [[ "$ref" == refs/heads/chore_release-* ]]; then
            echo "bucket=${{ env._DEPLOY_BUCKET_RELEASE }}" >> "$GITHUB_OUTPUT"
            echo "invalidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "bucket=${{ env._DEPLOY_BUCKET_INTERNAL }}" >> "$GITHUB_OUTPUT"
            echo "invalidate=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Download build artifacts"
        uses: "actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131" # v7.0.0
        with:
          pattern: "logverifier-*"
          path: "artifacts"
          merge-multiple: true
      - name: "Stage installer files"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p to_upload
          find artifacts -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.yml' -o -name '*.yaml' \
            -o -name '*.blockmap' \
          \) -exec cp -v {} to_upload/ \;
          echo "Staged:"
          ls -la to_upload
      - name: "Configure AWS credentials (GitHub OIDC)"
        uses: "aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a" # v4.3.1
        with:
          role-to-assume: ${{ vars.OT_LOGVIEWER_DEPLOY_ROLE }}
          aws-region: us-east-1
      - name: "Sync artifacts to S3"
        run: |
          aws s3 sync --acl=public-read to_upload/ \
            "s3://${{ steps.target.outputs.bucket }}/${{ env._DEPLOY_FOLDER }}"
      - name: "Invalidate CloudFront cache (builds.opentrons.com)"
        if: steps.target.outputs.invalidate == 'true' && vars.OT_LOGVIEWER_BUILDS_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          set -euo pipefail
          INVALIDATION_ID="$(
            aws cloudfront create-invalidation \
              --distribution-id '${{ vars.OT_LOGVIEWER_BUILDS_CLOUDFRONT_DISTRIBUTION_ID }}' \
              --paths '/logverifier/*' \
              --output text \
              --query 'Invalidation.Id'
          )"
          echo "Started CloudFront invalidation: ${INVALIDATION_ID}"
